blueprint:
  name: "Companion app: clear a notification"
  description: >
    Clear an existing notification with a given tag from one or more iOS or Android devices running
    the official Home Assistant companion app, using a notification command.


    Platform limitations may require the app to have been recently used to clear the
    notification: this applies for all iOS notifications, and any Android notifications
    not marked as critical. On iOS, only the most recent critical notification with the
    given tag is cleared.
    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notifications-basic#clearing).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/clear_notification.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will clear the notification.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for the notification to be cleared.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then clear the notification
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        clear the notification on the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The devices to clear the notification on.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        tag:
          name: Tag
          description: The tag of the notification you wish to clear.
          selector:
            text:

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the clear notification command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: clear_notification
            data:
              tag: !input tag
