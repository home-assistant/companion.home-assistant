blueprint:
  name: "Companion app: set the screen off timeout"
  description: >
    Set the screen off timeout on one or more Android devices running the official
    Home Assistant companion app, using a notification command.


    The timeout will respect the minimum and maximum defined by the Android system.
    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notification-commands#screen-off-timeout).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/command_screen_off_timeout.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will set the screen off timeout.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for the screen off timeout to be set.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then set the screen off timeout
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        set the screen off timeout on the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The Android devices to set the screen off timeout on.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        command:
          name: Screen off timeout
          description: The timeout value in milliseconds, for example 10000 for 10 seconds.
          default: 30000
          selector:
            number:
              min: 0
              mode: box
              unit_of_measurement: milliseconds

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the screen off timeout command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: command_screen_off_timeout
            data:
              command: !input command
