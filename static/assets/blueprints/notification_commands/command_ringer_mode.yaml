blueprint:
  name: "Companion app: set the ringer mode"
  description: >
    Set the ringer mode on one or more Android devices running the official
    Home Assistant companion app, using a notification command.


    Certain devices will need to grant access to the notification policy,
    which the app will ask for the first time this command is used.
    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notification-commands#ringer-mode).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/command_ringer_mode.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will set the ringer mode.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for the ringer mode to be set.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then set the ringer mode
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        set the ringer mode on the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The Android devices to set the ringer mode on.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        command:
          name: Ringer mode
          description: >
            The ringer mode to set. "Normal" and "Vibrate" will turn off Do Not Disturb if it is
            enabled and supported, while "Silent" will turn it on.
          selector:
            select:
              options:
                - label: Normal
                  value: normal
                - label: Vibrate
                  value: vibrate
                - label: Silent
                  value: silent

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the ringer mode command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: command_ringer_mode
            data:
              command: !input command
