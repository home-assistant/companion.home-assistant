blueprint:
  name: "Companion app: set wake word detection"
  description: >
    Turn wake word detection for Assist on or off on one or more Android devices running the official
    Home Assistant companion app, using a notification command. This requires Home Assistant
    to be set as the default digital assistant app on the device.


    Wake word detection can be battery-intensive, use this command to enable it only when needed.
    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notification-commands#wake-word-detection).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/command_wake_word_detection.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will set wake word detection.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for wake word detection to be set.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then set wake word detection
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        turn wake word detection on or off on the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The Android devices to set wake word detection on.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        command:
          name: Wake word detection
          description: Whether to turn wake word detection on or off.
          selector:
            select:
              options:
                - label: Turn on
                  value: turn_on
                - label: Turn off
                  value: turn_off

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the wake word detection command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: command_wake_word_detection
            data:
              command: !input command
