blueprint:
  name: "Companion app: launch an app activity"
  description: >
    Launch an activity in any app on one or more Android devices running the official
    Home Assistant companion app, using a notification command.


    The first time this command is used, the app will ask you to grant the permission
    to display over other apps.
    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notification-commands#activity).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/command_activity.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will launch the activity.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for the activity to be launched.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then launch the activity
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        launch the activity on the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The Android devices to launch the activity on.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        intent_action:
          name: Intent action
          description: 'The intent action string, for example: "android.intent.action.VIEW".'
          selector:
            text:
        intent_uri:
          name: Intent URI (optional)
          description: 'The URI to launch the activity with, if the activity requires one, for example: "google.navigation:q=home".'
          default: ""
          selector:
            text:
        intent_package_name:
          name: Package name (optional)
          description: >
            The package of the app in which the activity is to be launched, for example:
            "com.google.android.apps.maps". If not set, Android will make a best effort to pick a default.
          default: ""
          selector:
            text:
        intent_class_name:
          name: Class name (optional)
          description: The full class name of the activity, if the app requires the class or component to be provided.
          default: ""
          selector:
            text:
        intent_extras:
          name: Intent extras (optional)
          description: >
            Extras to add to the intent. Separate multiple extras with a comma ","
            and separate the name and value of each extra with a colon ":",
            for example: "alarm_label:work,alarm_enabled:false".
          default: ""
          selector:
            text:
        intent_type:
          name: MIME type (optional)
          description: The MIME type string, if the activity requires one.
          default: ""
          selector:
            text:

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the activity command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: command_activity
            data:
              intent_action: !input intent_action
              intent_uri: !input intent_uri
              intent_package_name: !input intent_package_name
              intent_class_name: !input intent_class_name
              intent_extras: !input intent_extras
              intent_type: !input intent_type
