blueprint:
  name: "Companion app: remove a notification channel"
  description: >
    Remove a notification channel from the device settings on one or more Android devices running
    the official Home Assistant companion app, using a notification command.


    Removing a channel doesn't reset the settings to the default values, it just removes
    it from the notification channels list. If you send a notification to a removed channel,
    it will restore it.
    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notifications-basic#removing-a-channel).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/remove_channel.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will remove the notification channel.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for the notification channel to be removed.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then remove the notification channel
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        remove the notification channel on the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The Android devices to remove the notification channel on.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        channel:
          name: Channel
          description: 'The name of the notification channel you wish to remove, for example: "Motion".'
          selector:
            text:

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the remove channel command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: remove_channel
            data:
              channel: !input channel
