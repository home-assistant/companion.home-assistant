blueprint:
  name: "Companion app: set automatic screen brightness"
  description: >
    Turn automatic screen brightness on or off on one or more Android devices running the official
    Home Assistant companion app, using a notification command.


    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notification-commands#auto-screen-brightness).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/command_auto_screen_brightness.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will set automatic screen brightness.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for automatic screen brightness to be set.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then set automatic screen brightness
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        turn automatic screen brightness on or off on the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The Android devices to set automatic screen brightness on.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        command:
          name: Automatic screen brightness
          description: Whether to turn automatic screen brightness on or off.
          selector:
            select:
              options:
                - label: Turn on
                  value: turn_on
                - label: Turn off
                  value: turn_off

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the automatic screen brightness command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: command_auto_screen_brightness
            data:
              command: !input command
