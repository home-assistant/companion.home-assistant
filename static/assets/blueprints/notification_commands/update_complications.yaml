blueprint:
  name: "Companion app: update Apple Watch complications"
  description: >
    Update the complications on the Apple Watches paired to one or more iOS devices running the official
    Home Assistant companion app, using a notification command.


    Updates are limited by the system to 50 per day, and it may take a few seconds or a few
    minutes for the update to fully apply. Manually updating via command does not yet work
    when using Local Push.
    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/apple-watch/complications#manual-updates).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/update_complications.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will update the complications.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for the complications to be updated.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then update the complications
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        update the complications on the Apple Watches paired to the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The iOS devices paired to the Apple Watches to update the complications on.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the update complications command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: update_complications
