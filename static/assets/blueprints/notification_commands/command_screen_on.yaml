blueprint:
  name: "Companion app: turn on the screen"
  description: >
    Turn on the screen on one or more Android devices running the official
    Home Assistant companion app, using a notification command.


    This will not remove or disable any lock screens you have set up on the device.
    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notification-commands#screen-on).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/command_screen_on.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will turn on the screen.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for the screen to be turned on.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then turn on the screen
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        turn on the screen on the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The Android devices to turn on the screen on.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        keep_screen_on:
          name: Keep the screen on
          description: >
            Enable the "Keep screen on" setting of the app. The screen will remain on only while
            the app is active, otherwise it will turn back off. When this is off, the
            "Keep screen on" setting is left unchanged.
          default: false
          selector:
            boolean:

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
      keep_screen_on: !input keep_screen_on
  - alias: "Send the screen on command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: command_screen_on
            data:
              command: "{{ 'keep_screen_on' if keep_screen_on else '' }}"
