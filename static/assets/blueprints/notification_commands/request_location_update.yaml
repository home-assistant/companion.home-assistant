blueprint:
  name: "Companion app: request a location update"
  description: >
    Request a location update from one or more iOS or Android devices running the official
    Home Assistant companion app, using a notification command. The notification is not visible
    to the device owner and only works when the app is running or in the background.


    Do not rely on this command, and do not send it too frequently: location updates are a
    little bit hit or miss because the system imposes a maximum time allowed for the app to
    work with the notification, and requesting updates too often may have a negative impact
    on your device's battery life and health.
    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notification-commands#request-location-updates).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/request_location_update.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will request a location update.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for the location update to be requested.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then request a location update
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        request a location update from the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The devices to request a location update from.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the request location update command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: request_location_update
