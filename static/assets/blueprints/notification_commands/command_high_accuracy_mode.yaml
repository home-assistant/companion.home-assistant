blueprint:
  name: "Companion app: control high accuracy mode"
  description: >
    Control the high accuracy mode of the background location sensor on one or more Android devices
    running the official Home Assistant companion app, using a notification command.


    The difference between "Turn on/off" and "Force on/off" is only relevant if you have zone
    or Bluetooth constraints set in the high accuracy mode settings.
    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notification-commands#high-accuracy-mode).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/command_high_accuracy_mode.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will control high accuracy mode.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for high accuracy mode to be controlled.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then control high accuracy mode
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        send the selected high accuracy mode command to the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The Android devices to control high accuracy mode on.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        command:
          name: Command
          description: >
            What to change on high accuracy mode. "Force on" keeps high accuracy mode active
            until "Force off" is sent or the constraints go from active to inactive, and the
            other way around for "Force off".
          selector:
            select:
              options:
                - label: Turn on
                  value: turn_on
                - label: Turn off
                  value: turn_off
                - label: Force on
                  value: force_on
                - label: Force off
                  value: force_off
                - label: Set the update interval
                  value: high_accuracy_set_update_interval
        high_accuracy_update_interval:
          name: Update interval
          description: >
            The update interval to set, when using the "Set the update interval" command.
            After performing this command high accuracy mode will restart,
            which can take a few seconds to complete.
          default: 60
          selector:
            number:
              min: 5
              mode: box
              unit_of_measurement: seconds

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the high accuracy mode command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: command_high_accuracy_mode
            data:
              command: !input command
              high_accuracy_update_interval: !input high_accuracy_update_interval
