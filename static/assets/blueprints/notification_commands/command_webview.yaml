blueprint:
  name: "Companion app: open a dashboard or view"
  description: >
    Open the app to the homepage or any dashboard or view on one or more Android devices running the official
    Home Assistant companion app, using a notification command.


    The first time this command is used, the app will ask you to grant the permission to display
    over other apps.
    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notification-commands#webview).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/command_webview.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will open the app.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for the app to be opened.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then open the app
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        open the app on the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The Android devices to open the app on.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        command:
          name: Path (optional)
          description: >
            The path to the dashboard or view to open, for example: "/lovelace/settings".
            You can also open the more info panel for any entity by entering "entityId:"
            followed by the entity, for example: "entityId:sun.sun".
            If left empty, the app opens to the homepage.
          default: ""
          selector:
            text:

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the open app command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: command_webview
            data:
              command: !input command
