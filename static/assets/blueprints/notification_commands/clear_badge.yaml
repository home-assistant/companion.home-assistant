blueprint:
  name: "Companion app: clear the app icon badge"
  description: >
    Silently remove the badge from the app icon on one or more iOS devices running the official
    Home Assistant companion app, using a notification command. No notification is
    displayed on the device.


    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notifications-basic#badge).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/clear_badge.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will clear the app icon badge.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for the app icon badge to be cleared.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then clear the app icon badge
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        clear the app icon badge on the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The iOS devices to clear the app icon badge on.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the clear badge command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: clear_badge
