blueprint:
  name: "Companion app: control media playback"
  description: >
    Control an active media session on one or more Android devices running the official
    Home Assistant companion app, using a notification command.


    The command only works when the selected app has an active media session.
    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notification-commands#media).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/command_media.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will send the media command.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for the media command to be sent.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then control media playback
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        send the media command to the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The Android devices to control media playback on.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        media_command:
          name: Media command
          description: The media command to send.
          selector:
            select:
              options:
                - label: Play
                  value: play
                - label: Pause
                  value: pause
                - label: Play/pause
                  value: play_pause
                - label: Next
                  value: next
                - label: Previous
                  value: previous
                - label: Fast forward
                  value: fast_forward
                - label: Rewind
                  value: rewind
                - label: Stop
                  value: stop
        media_package_name:
          name: Package name
          description: 'The package name of the app you wish to control, for example: "com.spotify.music".'
          selector:
            text:

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the media command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: command_media
            data:
              media_command: !input media_command
              media_package_name: !input media_package_name
