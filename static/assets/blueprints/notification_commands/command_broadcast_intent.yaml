blueprint:
  name: "Companion app: send a broadcast intent"
  description: >
    Send a broadcast intent to another app on one or more Android devices running the official
    Home Assistant companion app, using a notification command. Not all apps support intents;
    the package name and action are provided by the app you wish to send the intent to.


    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notification-commands#broadcast-intent).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/command_broadcast_intent.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will send the broadcast intent.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for the broadcast intent to be sent.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then send the broadcast intent
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        send the broadcast intent from the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The Android devices to send the broadcast intent from.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        intent_action:
          name: Intent action
          description: 'The intent action string, for example: "com.urbandroid.sleep.alarmclock.START_SLEEP_TRACK".'
          selector:
            text:
        intent_package_name:
          name: Package name
          description: 'The package of the app the intent is for, for example: "com.urbandroid.sleep".'
          selector:
            text:
        intent_class_name:
          name: Class name (optional)
          description: The full class name, if the app requires the class or component to be provided.
          default: ""
          selector:
            text:
        intent_extras:
          name: Intent extras (optional)
          description: >
            Extras to add to the intent. Separate multiple extras with a comma ","
            and separate the name and value of each extra with a colon ":",
            for example: "alarm_label:work,alarm_enabled:false".
          default: ""
          selector:
            text:

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the broadcast intent command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: command_broadcast_intent
            data:
              intent_action: !input intent_action
              intent_package_name: !input intent_package_name
              intent_class_name: !input intent_class_name
              intent_extras: !input intent_extras
