blueprint:
  name: "Companion app: set the volume level"
  description: >
    Set the volume level for an audio stream on one or more Android devices running the official
    Home Assistant companion app, using a notification command.


    Certain devices will need to grant access to the notification policy,
    which the app will ask for the first time this command is used. Changing the volume level
    can have a direct impact on Do Not Disturb and ringer modes; behavior will vary from
    device to device.
    For more information about the command, or how to add it as a step in your existing automation,
    [review the documentation](https://companion.home-assistant.io/docs/notifications/notification-commands#volume-level).
  domain: automation
  source_url: https://github.com/home-assistant/companion.home-assistant/blob/master/static/assets/blueprints/notification_commands/command_volume_level.yaml
  author: Home Assistant
  homeassistant:
    min_version: 2024.10.0 # For input sections and the current automation syntax
  input:
    trigger:
      name: When
      description: >
        A trigger is a specific event happening in or around your home, for example: "When the sun sets".
        Any trigger added here will set the volume level.
      selector:
        trigger:
    condition:
      name: And if (optional)
      description: >
        All conditions added here need to be satisfied for the volume level to be set.
        A condition can be satisfied or not at any given time, for example: "If [name] is home".
        You can use building blocks to create more complex conditions.
      default: []
      selector:
        condition:
    notification_section:
      name: Then set the volume level
      description: >
        If the trigger occurred, and all conditions have been met (or there are no conditions),
        set the volume level on the selected devices.
      input:
        notify_devices:
          name: Devices
          description: The Android devices to set the volume level on.
          selector:
            device:
              multiple: true
              filter:
                integration: mobile_app
        media_stream:
          name: Audio stream
          description: >
            The audio stream to set the volume level for. The assistant stream is only available
            on Android 17 and newer, and requires the app to be set as the default assistant.
          selector:
            select:
              options:
                - label: Alarm
                  value: alarm_stream
                - label: Voice call
                  value: call_stream
                - label: DTMF tones
                  value: dtmf_stream
                - label: Music
                  value: music_stream
                - label: Notification
                  value: notification_stream
                - label: Ring
                  value: ring_stream
                - label: System
                  value: system_stream
                - label: Assistant
                  value: assistant_stream
        command:
          name: Volume level
          description: >
            The volume level to set. If the level is larger than the maximum for the stream,
            the maximum level will be used.
          default: 5
          selector:
            number:
              min: 0
              max: 100
              mode: box

mode: parallel

triggers: !input trigger
conditions: !input condition

actions:
  - variables:
      notify_devices: !input notify_devices
  - alias: "Send the volume level command to every selected device"
    repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            message: command_volume_level
            data:
              media_stream: !input media_stream
              command: !input command
